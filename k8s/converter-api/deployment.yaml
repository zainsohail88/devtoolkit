apiVersion: apps/v1
kind: Deployment
metadata:
  name: converter-api
  namespace: devtoolkit
  labels:
    app.kubernetes.io/name: converter-api
    app.kubernetes.io/part-of: devtoolkit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: converter-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converter-api
        app.kubernetes.io/part-of: devtoolkit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: converter-api
          # The production deploy workflow replaces this tag with a commit SHA.
          image: ghcr.io/zainsohail88/devtoolkit/converter-api:latest
          # IfNotPresent lets KinD use an image loaded with `kind load docker-image`.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: converter-api-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
