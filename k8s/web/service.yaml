apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: devtoolkit
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: devtoolkit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
