apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: devtoolkit
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: devtoolkit
data:
  LOG_LEVEL: info
  # In-cluster address of the converter-api Service. Browsers never reach it directly.
  CONVERTER_API_URL: http://converter-api:8000
  CONVERTER_API_AUTH: none
