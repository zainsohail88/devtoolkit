<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevToolkit{% endblock %}</title>
  <meta name="description" content="{% block description %}DevOps conversion tools: Docker Compose to Kubernetes, YAML validation.{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
      <a href="/" class="font-semibold">DevToolkit</a>
      <a href="/compose-to-k8s" class="text-sm text-slate-600 hover:text-slate-900">Compose → Kubernetes</a>
      <a href="/validate-yaml" class="text-sm text-slate-600 hover:text-slate-900">YAML validator</a>
      <a href="https://github.com/zainsohail88/devtoolkit" class="ml-auto text-sm text-slate-600 hover:text-slate-900">GitHub</a>
    </nav>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-5xl px-4 py-8 text-sm text-slate-500">
    Open source, MIT licensed. Inputs are processed in memory and not stored.
  </footer>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
