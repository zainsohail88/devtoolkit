<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevToolkit{% endblock %}</title>
  <meta name="description" content="{% block description %}Converters for infrastructure configs. Open source, nothing stored.{% endblock %}">
  <script>{{ theme_script|safe }}</script>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
</head>
<body class="min-h-screen bg-surface font-sans text-step-0 text-ink">
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="sticky top-0 z-10 border-b border-divider bg-glass backdrop-blur-md">
    <nav aria-label="Main" class="mx-auto flex max-w-measure-wide flex-wrap items-center gap-x-6 px-4">
      <a href="/" class="inline-flex min-h-11 items-center gap-2 font-semibold">
        <span class="inline-flex size-7 items-center justify-center rounded-md bg-accent text-on-accent">{% include "icons/boxes.svg" %}</span>
        DevToolkit
      </a>
      <a href="/compose-to-k8s" class="nav-link"{% if request.url.path == '/compose-to-k8s' %} aria-current="page"{% endif %}>Compose → Kubernetes</a>
      <a href="/validate-yaml" class="nav-link"{% if request.url.path == '/validate-yaml' %} aria-current="page"{% endif %}>YAML check</a>
      <div class="ml-auto flex items-center gap-2">
        <a href="https://github.com/zainsohail88/devtoolkit" class="nav-link" aria-label="DevToolkit on GitHub">{% include "icons/github.svg" %}<span class="hidden sm:inline">GitHub</span></a>
        <button type="button" class="btn btn-ghost btn-sm" data-theme-toggle hidden aria-label="Switch theme">
          <span data-theme-icon="dark">{% include "icons/moon.svg" %}</span>
          <span data-theme-icon="light" hidden>{% include "icons/sun.svg" %}</span>
        </button>
      </div>
    </nav>
  </header>
  <main id="main" class="mx-auto max-w-measure-wide px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto flex max-w-measure-wide flex-wrap items-center gap-x-6 gap-y-2 px-4 py-8 text-small text-ink-muted">
    <span>Open source, MIT licensed.</span>
    <span>Everything is processed in memory. Nothing you paste is stored.</span>
  </footer>
  <script src="{{ static_url('vendor/editor.js') }}"></script>
  <script src="{{ static_url('app.js') }}"></script>
</body>
</html>
