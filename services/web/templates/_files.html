<div class="grid gap-3{% if not files_stacked %} md:grid-cols-[14rem_1fr]{% endif %}" data-files>
  <nav aria-label="Generated files" class="rounded-lg border border-divider bg-surface-raised p-2">
    <p class="px-3 py-2 text-small text-ink-muted">{{ files|length }} file{{ '' if files|length == 1 else 's' }}{% if files_label %}, {{ files_label }}{% endif %}</p>
    <ul role="tablist" class="grid gap-1{% if files_stacked %} grid-cols-2 sm:grid-cols-3{% endif %}">
      {% for file in files %}
      <li><a role="tab" href="#file-{{ loop.index0 }}" aria-controls="file-{{ loop.index0 }}" aria-selected="{{ 'true' if loop.first else 'false' }}" class="file-tab" data-file-tab="{{ loop.index0 }}">{% include "icons/file-code.svg" %}<span class="truncate">{{ file.path }}</span></a></li>
      {% endfor %}
    </ul>
  </nav>
  <div class="min-w-0">
    {% for file in files %}
    <article id="file-{{ loop.index0 }}" role="tabpanel" data-file-panel="{{ loop.index0 }}" data-path="{{ file.path }}" class="{% if not loop.first %}mt-6 md:mt-0{% endif %}">
      <header class="flex flex-wrap items-center justify-between gap-2 pb-2">
        <h3 class="font-mono text-small text-ink-muted">{{ file.path }}</h3>
        <div class="flex gap-2">
          <button type="button" class="btn btn-secondary btn-sm" data-copy="file-{{ loop.index0 }}-content">{% include "icons/copy.svg" %} Copy</button>
          <button type="button" class="btn btn-secondary btn-sm" data-download="file-{{ loop.index0 }}-content" data-filename="{{ file.path.split('/')[-1] }}">{% include "icons/download.svg" %} Download</button>
        </div>
      </header>
      <pre id="file-{{ loop.index0 }}-content" class="code" data-file-content>{{ file.content }}</pre>
    </article>
    {% endfor %}
  </div>
</div>
