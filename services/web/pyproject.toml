[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../converter-api"]

[tool.coverage.run]
source = [
    "api_client",
    "archives",
    "conversions",
    "error_pages",
    "errors",
    "examples",
    "inputs",
    "log_config",
    "main",
    "messages",
    "middleware",
    "models",
    "rendering",
    "routes",
    "security",
    "settings",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
