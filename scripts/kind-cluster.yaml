# Local Kubernetes cluster for development and CI. kind version: see .tool-versions.
#   make cluster-up     create it
#   make cluster-down   delete it
# The node image (the default for that kind version) is pinned by digest, so every
# machine and CI run the same Kubernetes. Update both together.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devtoolkit
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
