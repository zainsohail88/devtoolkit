name: Bug report
description: Something converts wrongly, crashes or doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Please **don't** file it here. See [SECURITY.md](https://github.com/zainsohail88/devtoolkit/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The compose file or request body that shows the problem. Remove anything private first.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: The response, error message or generated manifest.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit SHA, if you know it.
