# Weekly update PRs. Minor and patch bumps are grouped into one PR per ecosystem to keep
# the noise down; major versions get their own PR so breaking changes are reviewed alone.
version: 2
updates:
  - package-ecosystem: pip
    directory: /services/converter-api
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /services/converter-api
    schedule:
      interval: weekly
