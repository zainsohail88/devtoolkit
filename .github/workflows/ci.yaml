name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main run finish so its image gets published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  KUBECONFORM_VERSION: "v0.7.0"
  SERVICE_DIR: services/converter-api

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.SERVICE_DIR }}
          push: false
          load: true
          tags: converter-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name converter-api -p 8000:8000 converter-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs converter-api
          exit 1

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kubeconform -strict -summary -output pretty k8s/

  # Deploys k8s/ to a real kind cluster (same config as `make cluster-up`) and calls the API.
  # Catches what static checks can't: probes, securityContext vs the image, Pod Security.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Same name and tag as the manifest, so the pods use the image loaded below
      # instead of pulling from the registry.
      - name: Image name from the manifest
        run: echo "IMAGE=$(scripts/image-name.sh):latest" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.SERVICE_DIR }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version_file: .tool-versions
          config: scripts/kind-cluster.yaml
          cluster_name: devtoolkit
      - name: Load image and deploy
        run: |
          kind load docker-image "$IMAGE" --name devtoolkit
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/converter-api/
          kubectl -n devtoolkit rollout status deployment/converter-api --timeout=180s
      - name: Call the API through the Service
        run: |
          kubectl -n devtoolkit port-forward svc/converter-api 8000:8000 > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/ready
          curl -fsS localhost:8000/convert/compose-to-k8s \
            -H 'Content-Type: application/json' \
            -d '{"compose_yaml": "services:\n  web:\n    image: nginx\n    ports: [\"80\"]"}' \
            | tee /tmp/convert.json
          grep -q '"success":true' /tmp/convert.json
      - name: Show cluster state
        if: failure()
        run: |
          kubectl -n devtoolkit get all
          kubectl -n devtoolkit describe pods
          kubectl -n devtoolkit logs deployment/converter-api --all-containers --tail=100 || true
          cat /tmp/port-forward.log || true

  # Only after every check above passes, and only for pushes to main (not PRs).
  publish:
    needs: [lint, test, build, validate-k8s, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-push.yaml
